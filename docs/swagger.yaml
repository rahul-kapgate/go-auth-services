basePath: /api/v1/auth
definitions:
  handler.signupRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Authentication service with email OTP, JWT access tokens and refresh
    tokens.
  title: Go Auth Service API
  version: "1.0"
paths:
  /signup:
    post:
      consumes:
      - application/json
      description: Creates a user account and sends an email verification OTP.
      parameters:
      - description: Signup details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.signupRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Signup successful
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Email already registered
          schema:
            additionalProperties: true
            type: object
        "429":
          description: OTP cooldown active
          schema:
            additionalProperties: true
            type: object
      summary: Register a new user
      tags:
      - Authentication
schemes:
- http
swagger: "2.0"
